syntax = "proto3";

option csharp_namespace = "LogAnalyzerRpc.Protos";

package log_analyzer.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service LogAnalyzerAgentService {
	rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
	rpc GetAgentStatus(google.protobuf.Empty) returns (GetAgentStatusResponse);
	rpc ChangeDirectory(ChangeDirectoryRequest) returns (ChangeDirectoryResponse);
	rpc GetLogFiles(google.protobuf.Empty) returns (GetLogFilesResponse);
	rpc AnalyzeAll(AnalyzeAllRequest) returns (AnalyzeAllResponse);
	rpc AnalyzeFiles(AnalyzeFilesRequest) returns (AnalyzeFilesResponse);
	rpc GetAnalysisResult(GetAnalysisResultRequest) returns (stream GetAnalysisResultResponse);
	rpc QueryAnalysisResult(QueryAnalysisResultRequest) returns (stream GetAnalysisResultResponse);
	rpc GetCallTopology(GetCallTopologyRequest) returns (GetCallTopologyResponse);
	rpc GetEdgeCallLogs(GetEdgeCallLogsRequest) returns (stream GetAnalysisResultResponse);
	// 按 Request ID 追踪某次请求的完整调用链（T5.2），流式返回该 request-id 的所有日志（按时间升序）。
	rpc GetTrace(GetTraceRequest) returns (stream GetAnalysisResultResponse);
	// 将某个已分析日志文件的结果导出为 Parquet 文件（T5.1.a.a）。
	rpc ExportAnalysisResult(ExportAnalysisResultRequest) returns (ExportAnalysisResultResponse);
	// —— Token 管理（T5.1.a.b，需管理员权限）——
	rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
	rpc DeleteToken(DeleteTokenRequest) returns (OperationStatusMessage);
	rpc ListTokens(google.protobuf.Empty) returns (ListTokensResponse);
	rpc SetTokenRole(SetTokenRoleRequest) returns (OperationStatusMessage);
}

enum AgentErrorCode {
  NO_AGENT_ERROR = 0;
  INVALID_ARGUMENT = 1;
  DIRECTORY_NOT_FOUND = 2;
  FILE_NOT_FOUND = 3;
  INVALID_OPERATION = 4;
  INTERNAL_ERROR = 5;
}

message OperationStatusMessage {
  bool success = 1;
  AgentErrorCode code = 2;
  string message = 3;
}

message GetAgentStatusResponse {
  OperationStatusMessage status = 1;
  bool has_directory = 2;
  string current_directory = 3;
  bool is_analyzing = 4;
  repeated string file_names = 5;
}

message ChangeDirectoryRequest {
  string directory_path = 1;
}

message ChangeDirectoryResponse {
  OperationStatusMessage status = 1;
  string current_directory = 2;
  repeated string file_names = 3;
}

message GetLogFilesResponse {
  OperationStatusMessage status = 1;
  repeated string file_names = 3;
}

message AnalyzeAllRequest {
  int32 degree_of_parallelism = 1;
}

message AnalyzeAllResponse {
  OperationStatusMessage status = 1;
}

message AnalyzeFilesRequest {
  int32 degree_of_parallelism = 1;
  repeated string file_names = 2;
}

message AnalyzeFilesResponse {
  OperationStatusMessage status = 1;
}

message GetAnalysisResultRequest {
  string file_name = 1;
}

enum AnalysisStateEnum {
	NOT_ANALYZED = 0;
	SUCCEEDED = 1;
	FAILED = 2;
}

message AnalysisResultHeaderMessage {
	string file_name = 1;
	string full_name = 2;
	AnalysisStateEnum state = 3;
	optional string error_message = 4;
	int32 worker_id = 5;
}

enum LogSeverityEnum {
  INFO = 0;
  WARNING = 1;
  ERROR = 2;
}

enum LogEventTypeEnum {
  CALL = 0;
  REQUEST = 1;
  INTERNAL = 2;
}

message CallLogEntryMessage {
	int32 line_no = 1;
	google.protobuf.Timestamp timestamp = 2;
	string pod_name = 3;
	LogSeverityEnum severity = 4;
	LogEventTypeEnum event_type = 5;
	string request_id = 6;
	string target_service = 7;
	int32 duration_ms = 8;
}

message RequestLogEntryMessage {
	int32 line_no = 1;
	google.protobuf.Timestamp timestamp = 2;
	string pod_name = 3;
	LogSeverityEnum severity = 4;
	LogEventTypeEnum event_type = 5;
	string request_id = 6;
	string method = 7;
	string path = 8;
	int32 status_code = 9;
}

message InternalLogEntryMessage {
	int32 line_no = 1;
	google.protobuf.Timestamp timestamp = 2;
	string pod_name = 3;
	LogSeverityEnum severity = 4;
	LogEventTypeEnum event_type = 5;
	string exception_name = 6;
	string exception_message = 7;
}

message LogEntryMessage {
	oneof entry {
		CallLogEntryMessage call_log_entry = 1;
		RequestLogEntryMessage request_log_entry = 2;
		InternalLogEntryMessage internal_log_entry = 3;
	};
}

message GetAnalysisResultResponse {
	oneof payload {
		AnalysisResultHeaderMessage header = 1;
		LogEntryMessage log_entry = 2;
	}
	OperationStatusMessage status = 3;
}

// 按条件查询某个日志文件的分析结果。
// 所有的过滤条件均为可选；未填写的条件表示「不过滤该维度」。
message QueryAnalysisResultRequest {
  string file_name = 1;
  // 限定日志事件类型（Call / Request / Internal）。为空表示不限定。
  repeated LogEventTypeEnum event_types = 2;
  // 限定日志等级（Info / Warning / Error）。为空表示不限定。
  repeated LogSeverityEnum severities = 3;
  // 按 Request ID 做子串匹配（大小写不敏感）。Internal 类型日志无 Request ID，填写后会被排除。为空表示不限定。
  string request_id_pattern = 4;
  // 按产生日志的服务（pod 名，如 gateway-0）做子串匹配（大小写不敏感）。填写 gateway 即可匹配所有 gateway-* 的日志。为空表示不限定。
  string service_pattern = 5;
  // 时间范围下界（含），UTC 时间戳。不设置表示不限定下界。
  optional google.protobuf.Timestamp start_time = 6;
  // 时间范围上界（含），UTC 时间戳。不设置表示不限定上界。
  optional google.protobuf.Timestamp end_time = 7;
}

// 请求某个日志文件的云服务调用拓扑。
message GetCallTopologyRequest {
  string file_name = 1;
}

// 拓扑图中的一个结点，对应一个云服务。
message TopologyNodeMessage {
  string service = 1;
}

// 拓扑图中的一条有向边，表示 source_service 调用了 target_service。
message TopologyEdgeMessage {
  string source_service = 1;
  string target_service = 2;
  // 这条边对应的 Call 日志条数（用于前端展示，点击后再通过 GetEdgeCallLogs 拉取具体日志）。
  int32 call_count = 3;
}

message GetCallTopologyResponse {
  OperationStatusMessage status = 1;
  string file_name = 2;
  repeated TopologyNodeMessage nodes = 3;
  repeated TopologyEdgeMessage edges = 4;
}

// 请求某条有向边对应的所有 Call 日志。
message GetEdgeCallLogsRequest {
  string file_name = 1;
  string source_service = 2;
  string target_service = 3;
}

// 请求某次请求（Request ID）的完整调用链日志（T5.2）。响应复用 stream GetAnalysisResultResponse。
message GetTraceRequest {
  string file_name = 1;
  string request_id = 2;
}

// 将某个已分析日志文件的结果导出为 Parquet 文件（T5.1.a.a）。
message ExportAnalysisResultRequest {
  // 已分析成功的源日志文件名（位于 Agent 当前日志目录中）。
  string file_name = 1;
  // 输出 .parquet 的路径：可为绝对路径，或相对于当前日志目录的文件名/相对路径。
  string output_path = 2;
  // 目标文件已存在时是否覆盖；为 false 且文件存在则返回错误。
  bool overwrite = 3;
}

message ExportAnalysisResultResponse {
  OperationStatusMessage status = 1;
  // 实际写入的绝对路径，回传便于客户端提示。
  string written_path = 2;
  // 写入的日志条目数。
  int32 entry_count = 3;
}

// Token 权限等级（T5.1.a.b）。
enum TokenRoleEnum {
  TOKEN_NORMAL = 0;
  TOKEN_ADMIN = 1;
}

// 一个 token 的信息。
message TokenInfoMessage {
  string token = 1;
  TokenRoleEnum role = 2;
  string note = 3;
}

message CreateTokenRequest {
  TokenRoleEnum role = 1;
  string note = 2;
}

message CreateTokenResponse {
  OperationStatusMessage status = 1;
  TokenInfoMessage token = 2;
}

message DeleteTokenRequest {
  string token = 1;
}

message ListTokensResponse {
  OperationStatusMessage status = 1;
  repeated TokenInfoMessage tokens = 2;
  // 当前调用者自身的 token，便于前端高亮「自己」。
  string caller_token = 3;
}

message SetTokenRoleRequest {
  string token = 1;
  TokenRoleEnum role = 2;
}

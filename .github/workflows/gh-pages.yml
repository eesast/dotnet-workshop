name: Deploy Jekyll and Avalonia WASM demo

on:
  push:
    branches: ["main", "gh-pages"]
    paths-ignore:
      - "src/**"

  repository_dispatch:
    types:
      - demo-updated

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-jekyll:
    name: Build Jekyll site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: dotnet-workshop

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Convert TOC syntax
        working-directory: ./dotnet-workshop
        run: node assets/js/convert-toc.js

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./dotnet-workshop
          destination: ./_site

      - name: Upload Jekyll build
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site
          path: ./_site
          if-no-files-found: error
          retention-days: 1

  build-demo:
    name: Build Avalonia WASM demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout demo repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DOTNET_WORKSHOP_SOLUTION_REPOSITORY }}
          token: ${{ secrets.DOTNET_WORKSHOP_SOLUTION_READ }}
          path: dotnet-workshop-solution
          persist-credentials: false

      - name: Get demo repository commit
        id: demo-version
        working-directory: ./dotnet-workshop-solution
        shell: bash
        run: |
          set -euo pipefail

          DEMO_SHA="$(git rev-parse HEAD)"

          echo "sha=${DEMO_SHA}" >> "$GITHUB_OUTPUT"
          echo "Demo repository commit: ${DEMO_SHA}"

      - name: Restore Avalonia demo build cache
        id: demo-cache
        uses: actions/cache@v6
        with:
          path: ./demo-publish/wwwroot
          key: >-
            avalonia-demo-${{ runner.os }}-dotnet10-${{
            steps.demo-version.outputs.sha }}

      - name: Show demo cache status
        shell: bash
        run: |
          if [ "${{ steps.demo-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Avalonia demo cache hit."
            echo "Reusing build for commit:"
            echo "${{ steps.demo-version.outputs.sha }}"
          else
            echo "Avalonia demo cache miss."
            echo "The demo will be rebuilt."
          fi

      - name: Setup .NET
        if: steps.demo-cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install .NET WASM Tools
        if: steps.demo-cache.outputs.cache-hit != 'true'
        run: dotnet workload install wasm-tools

      - name: Restore WebAssembly workloads
        if: steps.demo-cache.outputs.cache-hit != 'true'
        run: |
          dotnet workload restore \
            ./dotnet-workshop-solution/src/LogAnalyzerClient/LogAnalyzerClient.Browser/LogAnalyzerClient.Browser.csproj

      - name: Publish Avalonia WASM demo
        if: steps.demo-cache.outputs.cache-hit != 'true'
        run: |
          dotnet publish \
            ./dotnet-workshop-solution/src/LogAnalyzerClient/LogAnalyzerClient.Browser/LogAnalyzerClient.Browser.csproj \
            -p:WasmBuildNative=true \
            -p:WasmEnableCompression=false \
            --configuration Release \
            --output ./demo-publish

      - name: Validate demo output
        shell: bash
        run: |
          set -euo pipefail

          test -d ./demo-publish/wwwroot
          test -f ./demo-publish/wwwroot/index.html
          test -f ./demo-publish/wwwroot/main.js
          test -d ./demo-publish/wwwroot/_framework
          test -f ./demo-publish/wwwroot/_framework/dotnet.js

          echo "Demo source commit:"
          echo "${{ steps.demo-version.outputs.sha }}"

          echo "Cache hit:"
          echo "${{ steps.demo-cache.outputs.cache-hit }}"

          echo "Avalonia WASM output:"
          find ./demo-publish/wwwroot \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100

      # Upload only wwwroot contents.
      # During assembly, these files will be downloaded into _site/demo.
      - name: Upload Avalonia WASM build
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-demo
          path: ./demo-publish/wwwroot
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble GitHub Pages site
    runs-on: ubuntu-latest

    needs:
      - build-jekyll
      - build-demo

    steps:
      - name: Download Jekyll build
        uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          path: ./_site

      - name: Download Avalonia demo
        uses: actions/download-artifact@v4
        with:
          name: avalonia-demo
          path: ./_site/demo

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail

          # Prevent Jekyll from excluding the Avalonia _framework directory.
          touch ./_site/.nojekyll

          echo "Final Pages structure:"
          find ./_site \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -200

          echo "Validating site..."
          test -f ./_site/index.html

          echo "Validating demo..."
          test -f ./_site/demo/index.html
          test -f ./_site/demo/main.js
          test -d ./_site/demo/_framework
          test -f ./_site/demo/_framework/dotnet.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest

    needs:
      - assemble

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
